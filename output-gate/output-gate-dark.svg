<text x="72" y="336.16" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">still add its best guess.</text><rect x="72" y="392.32" width="291.3" height="30" rx="4" fill="#1E2246" stroke="#8A9BFF" stroke-width="1.5" opacity="1"/><text x="84" y="412.57" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8A9BFF" text-anchor="start" letter-spacing="1.1" opacity="1">TEACHING MINIATURE · TIER 1</text><rect x="72" y="452.32" width="936" height="244" rx="12" fill="#1E2229" stroke="#FF7A93" stroke-width="1.8" opacity="1"/><text x="98" y="488.32" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FF7A93" text-anchor="start" letter-spacing="1.1" opacity="1">10,000 QUERIES, TRYING TO MAKE SOFTMAX OUTPUT NOTHING</text><text x="186.4" y="526.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9AA3AF" text-anchor="middle" letter-spacing="0" opacity="1">temp 0.01</text><text x="186.4" y="568.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#F2F0EC" text-anchor="middle" letter-spacing="0" opacity="1">2.3745</text><text x="363.20000000000005" y="526.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9AA3AF" text-anchor="middle" letter-spacing="0" opacity="1">temp 0.10</text><text x="363.20000000000005" y="568.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#F2F0EC" text-anchor="middle" letter-spacing="0" opacity="1">1.7172</text><text x="540" y="526.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9AA3AF" text-anchor="middle" letter-spacing="0" opacity="1">temp 1.00</text><text x="540" y="568.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#F2F0EC" text-anchor="middle" letter-spacing="0" opacity="1">1.6134</text><text x="716.8000000000001" y="526.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9AA3AF" text-anchor="middle" letter-spacing="0" opacity="1">temp 10.0</text><text x="716.8000000000001" y="568.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#F2F0EC" text-anchor="middle" letter-spacing="0" opacity="1">1.7028</text><text x="893.6" y="526.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9AA3AF" text-anchor="middle" letter-spacing="0" opacity="1">temp 100</text><text x="893.6" y="568.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#F2F0EC" text-anchor="middle" letter-spacing="0" opacity="1">1.7147</text><text x="540" y="600.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9AA3AF" text-anchor="middle" letter-spacing="0" opacity="1">smallest ‖output‖ seen</text><line x1="98" y1="622.3199999999999" x2="982" y2="622.3199999999999" stroke="#2E343D" stroke-width="1" stroke-linecap="butt" opacity="1"/><text x="98" y="652.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">The weights sum to 1.000000 at every temperature.</text><text x="98" y="676.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">The output is a weighted average of the values, so it is trapped inside them. Zero is not reachable.</text><rect x="72" y="716.3199999999999" width="936" height="272" rx="12" fill="#191D23" stroke="#8A9BFF" stroke-width="1.8" opacity="1"/><text x="98" y="752.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8A9BFF" text-anchor="start" letter-spacing="1.1" opacity="1">ONE MULTIPLICATION REMOVES THE LIMIT  ·  out ← sigmoid(g) × attention</text><text x="98" y="788.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#9AA3AF" text-anchor="start" letter-spacing="1" opacity="1">gate g</text><text x="372" y="788.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#9AA3AF" text-anchor="start" letter-spacing="1" opacity="1">sigmoid(g)</text><text x="632" y="788.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#9AA3AF" text-anchor="start" letter-spacing="1" opacity="1">‖output‖</text><text x="982" y="788.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#9AA3AF" text-anchor="end" letter-spacing="1" opacity="1">quieter by</text><text x="98" y="828.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">+4</text><text x="372" y="828.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">0.982</text><text x="632" y="828.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">1.689389</text><text x="982" y="828.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">1×</text><text x="98" y="862.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">0</text><text x="372" y="862.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">0.500</text><text x="632" y="862.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">0.860166</text><text x="982" y="862.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">2×</text><text x="98" y="896.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">−5</text><text x="372" y="896.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">0.0067</text><text x="632" y="896.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">0.011514</text><text x="982" y="896.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">149×</text><text x="98" y="930.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">−12</text><text x="372" y="930.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">0.000006</text><text x="632" y="930.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#8A9BFF" text-anchor="start" letter-spacing="0" opacity="1">0.000011</text><text x="982" y="930.3199999999999" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#8A9BFF" text-anchor="end" letter-spacing="0" opacity="1">162,756×</text><text x="98" y="964.3199999999999" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">The layer still did the work. The gate decides whether the result reaches the residual stream.</text><line x1="72" y1="1046" x2="1008" y2="1046" stroke="#2E343D" stroke-width="2" stroke-linecap="butt" opacity="1"/>
<text x="72" y="1094" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">A system that must answer needs a way to abstain.</text>
<text x="72" y="1153.2" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">Teaching miniature, Tier 1 · Ankit CPU run, pure Python, d = 32, 12 keys,</text>
<text x="72" y="1179.3" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">2,000 queries per temperature, seed 20260828 · Kimi K3’s released config</text>
<text x="72" y="1205.4" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">sets mla_use_output_gate true across its 24 full-attention layers; the</text>
<text x="72" y="1231.5" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">gate’s exact form is not established here.</text>
<text x="1008" y="1284" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#9AA3AF" text-anchor="end" letter-spacing="1.4" opacity="1">KIMI K3 SYSTEMS LAB</text>
