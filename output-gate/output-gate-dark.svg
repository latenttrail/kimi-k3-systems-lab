<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#14161A" stroke="none" stroke-width="1" opacity="1"/>
<text x="72" y="94" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#8A9BFF" text-anchor="start" letter-spacing="2.6" opacity="1">KIMI K3 SYSTEMS LAB</text>
<text x="72" y="152" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="700" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">Softmax attention cannot choose to</text>
