<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Kimi K3 Systems Lab visual</title><desc id="svg-desc">Technical visual.</desc>
<defs><marker id="ar-cobalt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#3538CD"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7C3AED"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B45309"/></marker><marker id="ar-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#BE123C"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0F766E"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B7280"/></marker></defs>
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#EAEEF6" stroke="none" stroke-width="1" opacity="1"/><defs>
    <pattern id="gfine" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#B9C4D6" stroke-width="0.8" opacity="0.85"/>
    </pattern>
    <pattern id="gbold" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#gfine)"/>
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#B9C4D6" stroke-width="1.3" opacity="1"/>
    </pattern></defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="url(#gbold)" stroke="none" stroke-width="1" opacity="1"/>
<text x="72" y="94" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#3538CD" text-anchor="start" letter-spacing="2.6" opacity="1">KIMI K3 SYSTEMS LAB</text>
<text x="72" y="152" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="47" font-weight="700" fill="#101828" text-anchor="start" letter-spacing="0" opacity="1">One retrieval error can have three</text>
<text x="72" y="205.57999999999998" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="47" font-weight="700" fill="#101828" text-anchor="start" letter-spacing="0" opacity="1">causes.</text>
<text x="72" y="297.15999999999997" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">A 24-seed audit separates a full memory, unfinished learning, and new</text>
<text x="72" y="329.32" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">memories disrupting old ones.</text><rect x="72" y="381.47999999999996" width="311.1" height="30" rx="4" fill="#E9EAFB" stroke="#3538CD" stroke-width="1.5" opacity="1"/><text x="84" y="401.72999999999996" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3538CD" text-anchor="start" letter-spacing="1.1" opacity="1">TEACHING MINIATURE · 24 SEEDS</text><text x="72" y="441.47999999999996" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="1.15" opacity="1">ASK THESE THREE QUESTIONS BEFORE CALLING MEMORY “FULL”</text><text x="72" y="468.47999999999996" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">mean ± SD across 24 seeds · 0 = exact · 1 = as wrong as returning zero</text><circle cx="118" cy="560.48" r="25" fill="#BE123C"/><text x="118" y="568.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#EAEEF6" text-anchor="middle" letter-spacing="0" opacity="1">1</text><line x1="156" y1="560.48" x2="198" y2="560.48" stroke="#BE123C" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="220" y="533.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#BE123C" text-anchor="start" letter-spacing="1.2" opacity="1">CAN IT FIT?</text><text x="220" y="578.48" font-family="'SF Mono','Menlo',monospace" font-size="35" font-weight="700" fill="#101828" text-anchor="start" letter-spacing="0" opacity="1">0.454 ± 0.065</text><text x="660" y="533.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">10 generated pairs: least-squares</text><text x="660" y="553.96" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">floor. No exact map for these</text><text x="660" y="574.44" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">draws.</text><line x1="72" y1="635.48" x2="1008" y2="635.48" stroke="#D9D2C6" stroke-width="1.5" stroke-linecap="butt" opacity="1"/><circle cx="118" cy="716.48" r="25" fill="#B45309"/><text x="118" y="724.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#EAEEF6" text-anchor="middle" letter-spacing="0" opacity="1">2</text><line x1="156" y1="716.48" x2="198" y2="716.48" stroke="#B45309" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="220" y="689.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1.2" opacity="1">HAS IT LEARNED ENOUGH?</text><text x="220" y="734.48" font-family="'SF Mono','Menlo',monospace" font-size="35" font-weight="700" fill="#101828" text-anchor="start" letter-spacing="0" opacity="1">0.177 ± 0.152</text><text x="660" y="689.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">8 pairs after 400 sweeps. An exact</text><text x="660" y="709.96" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">solution exists; settling varies by</text><text x="660" y="730.44" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">seed.</text><line x1="72" y1="791.48" x2="1008" y2="791.48" stroke="#D9D2C6" stroke-width="1.5" stroke-linecap="butt" opacity="1"/><circle cx="118" cy="872.48" r="25" fill="#3538CD"/><text x="118" y="880.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#EAEEF6" text-anchor="middle" letter-spacing="0" opacity="1">3</text><line x1="156" y1="872.48" x2="198" y2="872.48" stroke="#3538CD" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="220" y="845.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3538CD" text-anchor="start" letter-spacing="1.2" opacity="1">DID A NEW MEMORY DISRUPT THE OLD ONES?</text><text x="220" y="890.48" font-family="'SF Mono','Menlo',monospace" font-size="35" font-weight="700" fill="#101828" text-anchor="start" letter-spacing="0" opacity="1">0.993</text><text x="660" y="845.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">Mean error on old pairs after</text><text x="660" y="865.96" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">adding pair 8. Joint correction</text><text x="660" y="886.44" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">repairs it.</text><rect x="72" y="975.48" width="936" height="142" rx="12" fill="#EFEAE1" stroke="#D9D2C6" stroke-width="1.5" opacity="1"/><text x="98" y="1007.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="1.1" opacity="1">THE CONTROL: KEEP EVERY KEY</text><text x="98" y="1053.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">fixed 8×8 state</text><text x="98" y="1087.48" font-family="'SF Mono','Menlo',monospace" font-size="34" font-weight="700" fill="#BE123C" text-anchor="start" letter-spacing="0" opacity="1">0.4614</text><path d="M 414 1069.48 L 514 1069.48" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-teal)"/><text x="548" y="1053.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">full key retention</text><text x="548" y="1087.48" font-family="'SF Mono','Menlo',monospace" font-size="34" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="0" opacity="1">0.0063</text><text x="782" y="1083.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">at 10 pairs</text><line x1="72" y1="1133" x2="1008" y2="1133" stroke="#D9D2C6" stroke-width="2" stroke-linecap="butt" opacity="1"/>
<text x="72" y="1181" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#101828" text-anchor="start" letter-spacing="0" opacity="1">Error is an observation. Capacity, convergence and</text>
<text x="72" y="1218.2" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#101828" text-anchor="start" letter-spacing="0" opacity="1">interference are explanations.</text>
<text x="72" y="1277.4" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0" opacity="1">8×8 untrained linear state · seeded audit · not a Kimi K3 benchmark</text>
<text x="1008" y="1284" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.4" opacity="1">KIMI K3 SYSTEMS LAB</text>
</svg>
