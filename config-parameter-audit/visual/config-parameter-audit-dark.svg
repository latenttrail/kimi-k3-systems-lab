<text x="72" y="1149.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">Count the model that was built, not the one your</text>
