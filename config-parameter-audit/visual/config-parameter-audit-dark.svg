<text x="72" y="1245.88" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">Released + Derived, Tier 0 · Config + technical report read first-hand · KDA</text>
