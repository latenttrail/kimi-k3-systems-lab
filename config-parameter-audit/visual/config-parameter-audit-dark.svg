<text x="72" y="290.32" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">The arithmetic was right. The assumed expert width was not.</text><rect x="72" y="346.48" width="291.3" height="30" rx="4" fill="#1E2246" stroke="#8A9BFF" stroke-width="1.5" opacity="1"/><text x="84" y="366.73" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8A9BFF" text-anchor="start" letter-spacing="1.1" opacity="1">RELEASED + DERIVED · TIER 0</text><rect x="72" y="406.48" width="936" height="253" rx="12" fill="#1E2229" stroke="#FF7A93" stroke-width="1.8" opacity="1"/><text x="98" y="442.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FF7A93" text-anchor="start" letter-spacing="1.1" opacity="1">COUNT IT THE OBVIOUS WAY — EVERY EXPERT AN MLP OVER THE RESIDUAL STREAM</text><text x="98" y="478.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#9AA3AF" text-anchor="start" letter-spacing="1" opacity="1">component</text><text x="98" y="514.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">everything but the experts</text><text x="982" y="514.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">17.1 B</text><text x="98" y="544.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#FF7A93" text-anchor="start" letter-spacing="0" opacity="1">experts · 898 × 7,168 wide</text><text x="982" y="544.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#FF7A93" text-anchor="end" letter-spacing="0" opacity="1">5,457.6 B</text><text x="98" y="574.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#FF7A93" text-anchor="start" letter-spacing="0" opacity="1">TOTAL</text><text x="982" y="574.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#FF7A93" text-anchor="end" letter-spacing="0" opacity="1">5.47 T</text><line x1="98" y1="602.48" x2="982" y2="602.48" stroke="#2E343D" stroke-width="1" stroke-linecap="butt" opacity="1"/><text x="98" y="628.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#FF7A93" text-anchor="start" letter-spacing="0" opacity="1">Published: 2.8 T. Off by +95.5%.</text><rect x="72" y="681.48" width="936" height="394" rx="12" fill="#1E2229" stroke="#8A9BFF" stroke-width="1.8" opacity="1"/><text x="98" y="717.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8A9BFF" text-anchor="start" letter-spacing="1.1" opacity="1">THE KEY I HAD SKIMMED PAST — AND THE COUNT AGAIN</text><text x="98" y="753.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#9AA3AF" text-anchor="start" letter-spacing="1" opacity="1">component</text><text x="98" y="789.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">hidden_size · the residual stream</text><text x="982" y="789.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">7,168</text><text x="98" y="819.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#F0B24A" text-anchor="start" letter-spacing="0" opacity="1">routed_expert_hidden_size</text><text x="982" y="819.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#F0B24A" text-anchor="end" letter-spacing="0" opacity="1">3,584</text><text x="98" y="849.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">routed experts · 896 × 3,584 wide</text><text x="982" y="849.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">2,722.7 B</text><text x="98" y="879.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">shared experts · 2 × 7,168 wide</text><text x="982" y="879.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">12.2 B</text><text x="98" y="909.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">everything else</text><text x="982" y="909.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">17.1 B</text><text x="98" y="939.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#8A9BFF" text-anchor="start" letter-spacing="0" opacity="1">TOTAL</text><text x="982" y="939.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#8A9BFF" text-anchor="end" letter-spacing="0" opacity="1">2.752 T</text><text x="98" y="969.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">published</text><text x="982" y="969.48" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">2.800 T</text><line x1="98" y1="997.48" x2="982" y2="997.48" stroke="#2E343D" stroke-width="1" stroke-linecap="butt" opacity="1"/><text x="98" y="1023.48" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#8A9BFF" text-anchor="start" letter-spacing="0" opacity="1">The report: routed experts use a 3,584-wide latent; shared experts stay full width. Estimate gap:</text>
