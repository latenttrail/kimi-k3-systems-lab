acity="1">896 × 3 × 7,168 × 3,072 × 92</text><text x="982" y="575.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="21" font-weight="700" fill="#FF7A93" text-anchor="end" letter-spacing="0" opacity="1">5,445.5 B</text><text x="98" y="609.2" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#8A9BFF" text-anchor="start" letter-spacing="1.1" opacity="1">WHAT THE CONFIG RELEASES</text><rect x="98" y="625.2" width="300" height="26" rx="4" fill="#191D23" stroke="#2E343D" stroke-width="1" opacity="1"/><rect x="98" y="625.2" width="150" height="26" rx="4" fill="#8A9BFF" stroke="none" stroke-width="1" opacity="0.9"/><text x="414" y="644.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="700" fill="#8A9BFF" text-anchor="start" letter-spacing="0" opacity="1">3,584 wide</text><text x="98" y="673.2" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9AA3AF" text-anchor="start" letter-spacing="0" opacity="1">routed_expert_hidden_size · the routed branch runs in a narrower latent</text><text x="98" y="699.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="15" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">896 × 3 × 3,584 × 3,072 × 92</text><text x="982" y="699.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="21" font-weight="700" fill="#8A9BFF" text-anchor="end" letter-spacing="0" opacity="1">2,722.7 B</text><line x1="98" y1="721.2" x2="982" y2="721.2" stroke="#2E343D" stroke-width="1" stroke-linecap="butt" opacity="1"/><text x="98" y="749.2" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">One term changes. It decides</text><text x="326.70079999999996" y="749.2" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F0B24A" text-anchor="start" letter-spacing="0" opacity="1">2.72 trillion parameters</text><rect x="72" y="783.2" width="936" height="276" rx="12" fill="#1E2229" stroke="#8A9BFF" stroke-width="1.8" opacity="1"/><text x="98" y="819.2" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8A9BFF" text-anchor="start" letter-spacing="1.1" opacity="1">THE COUNT THAT LANDS — AND WHAT THE BUDGET THEN SAYS</text><text x="98" y="855.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">routed experts · 896 at 3,584 wide</text><text x="982" y="855.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="400" fill="#F2F0EC" text-anchor="end" letter-spacing="0" opacity="1">2,722.7 B</text><text x="98" y="885.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">shared experts · 2 at 7,168 wide</text><text x="982" y="885.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="400" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">12.2 B</text><text x="98" y="915.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="400" fill="#F2F0EC" text-anchor="start" letter-spacing="0" opacity="1">everything else</text><text x="982" y="915.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="400" fill="#9AA3AF" text-anchor="end" letter-spacing="0" opacity="1">17.1 B</text><text x="98" y="945.2" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="700" fill="#8A9BFF" text-anchor="start" letter-spacing="0" opacity="1">TOTAL</text><text x="982" y="945.2" font-family="'SF Mono',